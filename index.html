<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Protected Page</title>
<style>
  * { box-sizing: border-box; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    background: #f4f5f7;
    color: #222;
    margin: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    min-height: 100vh;
    padding: 16px;
  }
  .card {
    background: #fff;
    border-radius: 10px;
    box-shadow: 0 4px 24px rgba(0,0,0,0.08);
    padding: 32px 28px;
    width: 100%;
    max-width: 380px;
  }
  h1 { font-size: 18px; margin: 0 0 16px 0; font-weight: 600; }
  label { display: block; font-size: 13px; color: #555; margin-bottom: 6px; }
  input[type=password] {
    width: 100%;
    padding: 10px 12px;
    font-size: 15px;
    border: 1px solid #ccc;
    border-radius: 6px;
    outline: none;
  }
  input[type=password]:focus { border-color: #2c3e50; }
  button {
    margin-top: 16px;
    width: 100%;
    padding: 11px;
    font-size: 15px;
    background: #2c3e50;
    color: #fff;
    border: none;
    border-radius: 6px;
    cursor: pointer;
  }
  button:hover { background: #3d566e; }
  button:disabled { background: #999; cursor: not-allowed; }
  .error { color: #a02020; font-size: 13px; margin-top: 12px; display: none; }
</style>
</head>
<body>
  <div class="card" id="card">
    <h1>Protected Page</h1>
    <label for="pw">Пароль</label>
    <input type="password" id="pw" autocomplete="current-password" autofocus>
    <button id="go">Открыть</button>
    <div class="error" id="err">Неверный пароль</div>
  </div>

  var ITERATIONS = 100000;

  function b64ToBytes(b64) {
    var bin = atob(b64);
    var bytes = new Uint8Array(bin.length);
    for (var i = 0; i < bin.length; i++) bytes[i] = bin.charCodeAt(i);
    return bytes;
  }

  async function decrypt(password) {
    var enc = new TextEncoder();

    var keyMaterial = await crypto.subtle.importKey(
      "raw",
      enc.encode(password),
      { name: "PBKDF2" },
      false,
      ["deriveKey"]
    );

    var key = await crypto.subtle.deriveKey(
      {
        name: "PBKDF2",
        salt: b64ToBytes(SALT_B64),
        iterations: ITERATIONS,
        hash: "SHA-256"
      },
      keyMaterial,
      { name: "AES-CBC", length: 256 },
      false,
      ["decrypt"]
    );

    var plainBuf = await crypto.subtle.decrypt(
      { name: "AES-CBC", iv: b64ToBytes(IV_B64) },
      key,
      b64ToBytes(CIPHER_B64)
    );

    return new TextDecoder("utf-8").decode(plainBuf);
  }

  var card = document.getElementById("card");
  var pw   = document.getElementById("pw");
  var btn  = document.getElementById("go");
  var err  = document.getElementById("err");

  async function tryOpen() {
    err.style.display = "none";
    btn.disabled = true;
    btn.textContent = "Проверка...";
    try {
      var html = await decrypt(pw.value);
      document.open();
      document.write(html);
      document.close();
    } catch (e) {
      err.style.display = "block";
      btn.disabled = false;
      btn.textContent = "Открыть";
      pw.select();
    }
  }

  btn.addEventListener("click", tryOpen);
  pw.addEventListener("keydown", function (e) {
    if (e.key === "Enter") tryOpen();
  });
})();
