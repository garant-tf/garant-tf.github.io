<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>Мониторинг отчётов</title>
<style>
  * { box-sizing: border-box; }
  body {
    font-family: Consolas, "Microsoft YaHei", monospace;
    font-size: 13px;
    margin: 0;
    background: #f4f5f7;
    color: #222;
  }
  header {
    background: #2c3e50;
    color: #fff;
    padding: 12px 20px;
  }
  header h1 { margin: 0 0 4px 0; font-size: 20px; }
  header .meta { font-size: 12px; opacity: 0.8; }

  .layout { display: flex; align-items: flex-start; }
  .sidebar {
    width: 260px;
    padding: 12px;
    background: #eef1f5;
    border-right: 1px solid #d5d9e0;
    position: sticky;
    top: 0;
    max-height: 100vh;
    overflow: auto;
  }
  .sidebar h2 { font-size: 14px; margin: 0 0 8px 0; }
  .sidebar ul { list-style: none; padding-left: 0; margin: 0; }
  .sidebar li { margin: 3px 0; }
  .sidebar a { color: #2c3e50; text-decoration: none; font-size: 13px; }
  .sidebar a:hover { text-decoration: underline; }
  .toc-sections { padding-left: 16px !important; }
  .toc-sections a { color: #555; font-size: 12px; }

  .content { flex: 1; padding: 12px 20px; min-width: 0; }

  .tabs {
    display: flex;
    overflow-x: auto;
    white-space: nowrap;
    border-bottom: 2px solid #2c3e50;
    margin-bottom: 12px;
    scrollbar-width: thin;
  }
  .tab {
    flex: 0 0 auto;
    border: 1px solid #d5d9e0;
    border-bottom: none;
    background: #e8ebf0;
    color: #333;
    padding: 8px 16px;
    margin-right: 4px;
    cursor: pointer;
    border-radius: 6px 6px 0 0;
    font-size: 13px;
  }
  .tab:hover { background: #dde2ea; }
  .tab.active {
    background: #fff;
    color: #2c3e50;
    font-weight: bold;
    border-color: #2c3e50;
    position: relative;
    top: 2px;
  }

  .toolbar { margin: 8px 0 12px 0; }
  .toolbar button {
    background: #2c3e50;
    color: #fff;
    border: none;
    padding: 6px 12px;
    margin-right: 6px;
    border-radius: 4px;
    cursor: pointer;
    font-size: 12px;
  }
  .toolbar button:hover { background: #3d566e; }

  .pane { display: none; }
  .pane.active { display: block; }

  details.section {
    border: 1px solid #d5d9e0;
    border-radius: 6px;
    margin: 6px 0;
    background: #fff;
  }
  details.section > summary {
    cursor: pointer;
    padding: 8px 12px;
    font-weight: bold;
    background: #f7f9fc;
    border-radius: 6px;
    user-select: none;
  }
  details.section[open] > summary {
    border-bottom: 1px solid #e5e9ef;
    border-radius: 6px 6px 0 0;
  }
  summary .cnt { color: #888; font-weight: normal; font-size: 12px; }

  .section-body {
    max-height: 500px;
    overflow: auto;
    padding: 8px 12px;
  }

  .line {
    white-space: pre-wrap;
    word-break: break-word;
    padding: 1px 0;
    font-family: Consolas, "Microsoft YaHei", monospace;
    line-height: 1.35;
  }
  .line.meta {
    background: #f0f2f5;
    color: #555;
    border-left: 3px solid #b8bfc9;
    padding-left: 6px;
  }

  .error-box {
    background: #fdecea;
    border: 1px solid #f5c2c0;
    color: #a02020;
    padding: 10px 12px;
    border-radius: 6px;
  }

  .path-info {
    font-size: 11px;
    color: #666;
    margin: 4px 0 8px 0;
    padding: 3px 8px;
    background: #eef1f5;
    border-radius: 4px;
    word-break: break-all;
  }

  @media (max-width: 800px) {
    .layout { flex-direction: column; }
    .sidebar { width: 100%; position: static; max-height: none; border-right: none; border-bottom: 1px solid #d5d9e0; }
  }
</style>
</head>
<body>

<header>
  <h1>Мониторинг отчётов</h1>
  <div class="meta">Сформировано: 2026-09-23 10:28:05</div>
</header>

<div class="layout">
  <aside class="sidebar">
    <h2>Содержание</h2>
    <ul>
<li><a href="#" data-target="pane-0" class="toc-report">Сводный отчёт по серверам</a>
<ul class="toc-sections">

</ul>
</li>
<li><a href="#" data-target="pane-1" class="toc-report">Журнал проверок</a>
<ul class="toc-sections">
  <li><a href="#anchor-8" class="toc-section">Секция 1</a></li>
</ul>
</li>

    </ul>
  </aside>

  <main class="content">
    <div class="tabs" id="tabs">
  <button class="tab active" data-tab="pane-0">Сводный отчёт по серверам</button>
  <button class="tab" data-tab="pane-1">Журнал проверок</button>
  <button class="tab" data-tab="pane-2">Простой лог</button>

    </div>

    <div class="toolbar">
      <button type="button" id="btn-expand">Развернуть всё</button>
      <button type="button" id="btn-collapse">Свернуть всё</button>
    </div>

<div class="pane active" id="pane-0">
  <div class="path-info">Маска: e:\Utils_Scripts\CheckLog\reports\logs_*.txt → E:\Utils_Scripts\CheckLog\reports\logs_2026-09-21_07-33-56.txt</div>

  </div>
</details>
</div>
<div class="pane" id="pane-2">
  <div class="error-box">Файл не найден: C:\Reports\simple.txt</div>
</div>

  </main>
</div>

<script>
(function () {
  // --- Переключение вкладок ---
  var tabs = document.querySelectorAll('#tabs .tab');
  var panes = document.querySelectorAll('.pane');

  function activate(paneId) {
    for (var i = 0; i < tabs.length; i++) {
      var t = tabs[i];
      if (t.getAttribute('data-tab') === paneId) t.classList.add('active');
      else t.classList.remove('active');
    }
    for (var j = 0; j < panes.length; j++) {
      var p = panes[j];
      if (p.id === paneId) p.classList.add('active');
      else p.classList.remove('active');
    }
  }

  for (var i = 0; i < tabs.length; i++) {
    tabs[i].addEventListener('click', function () {
      activate(this.getAttribute('data-tab'));
    });
  }

  // --- Кнопки "Развернуть всё" / "Свернуть всё" для активной вкладки ---
  function activePane() {
    return document.querySelector('.pane.active');
  }

  document.getElementById('btn-expand').addEventListener('click', function () {
    var p = activePane(); if (!p) return;
    var ds = p.querySelectorAll('details'); 
    for (var i = 0; i < ds.length; i++) ds[i].open = true;
  });

  document.getElementById('btn-collapse').addEventListener('click', function () {
    var p = activePane(); if (!p) return;
    var ds = p.querySelectorAll('details');
    for (var i = 0; i < ds.length; i++) ds[i].open = false;
  });

  // --- Оглавление: клик -> активировать вкладку и развернуть секцию ---
  function handleTocClick(ev) {
    var a = ev.target.closest('a');
    if (!a) return;
    var href = a.getAttribute('href') || '';

    // Ссылка на отчёт (data-target)
    var target = a.getAttribute('data-target');
    if (target) {
      ev.preventDefault();
      activate(target);
      window.scrollTo({ top: 0, behavior: 'smooth' });
      return;
    }

    // Ссылка на секцию (#anchor)
    if (href.charAt(0) === '#') {
      ev.preventDefault();
      var el = document.getElementById(href.substring(1));
      if (!el) return;

      // Активируем вкладку, в которой лежит секция
      var pane = el.closest('.pane');
      if (pane) activate(pane.id);

      // Разворачиваем секцию и скроллим к ней
      if (el.tagName.toLowerCase() === 'details') el.open = true;
      el.scrollIntoView({ behavior: 'smooth', block: 'start' });
    }
  }

  document.querySelector('.sidebar').addEventListener('click', handleTocClick);

  // --- Активная вкладка при загрузке: первая ---
  if (panes.length > 0 && !document.querySelector('.pane.active')) {
    panes[0].classList.add('active');
    if (tabs.length > 0) tabs[0].classList.add('active');
  }
})();
</script>

</body>
</html>
